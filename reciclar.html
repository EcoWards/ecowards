<!DOCTYPE html>
<html lang="es">

<head>

  <link rel="icon" type="image/jpeg" href="./img/logo.jpeg">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reciclar</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

  <div class="login-container">

    <h2>♻️ Reciclar</h2>

    <form id="reciclarForm">

      <select id="tipo" required>

        <option value="botella">
          Botellas
        </option>

        <option value="lata">
          Latas
        </option>

        <option value="papel">
          Papel
        </option>

        <option value="carton">
          Cartón
        </option>

      </select>

      <input
        type="number"
        id="cantidad"
        placeholder="Cantidad"
        min="1"
        required
      >

      <button type="submit">
        Reciclar
      </button>

    </form>

    <button id="volver" type="button">
      Volver
    </button>

  </div>

  <!-- 💬 TOAST -->
  <div
    id="toastRecycle"
    class="toast-center hidden"
  ></div>

  <!-- 🎉 CONFETTI -->
  <canvas id="confettiCanvas"></canvas>

  <!-- ✅ IMPORTANTE -->
  <script
    type="module"
    src="reciclar.js"
  ></script>

</body>
</html>
